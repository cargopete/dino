[package]
name = "dino-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dino"
path = "src/main.rs"

# The Linux sandbox helper ships from here rather than its own crate so that one
# `cargo install` produces a working agent. RFC-0009 section 5.1 argued for a
# helper *process* over in-process unsafe; which crate builds it is packaging.
[[bin]]
name = "dino-confine"
path = "src/bin/dino-confine.rs"

[dependencies]
base64.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
dino-core.workspace = true
dino-eval.workspace = true
dino-exec.workspace = true
dino-model.workspace = true
dino-protocol.workspace = true
dino-rust.workspace = true
dino-sandbox.workspace = true
dino-tools.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
nix = { workspace = true, features = ["sched", "socket", "user"] }

[lints]
workspace = true
