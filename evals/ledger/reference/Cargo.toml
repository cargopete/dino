[package]
name = "ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
