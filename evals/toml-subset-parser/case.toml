name = "toml-subset-parser"
prompt = """
Implement `parse` in `src/lib.rs`: a parser for the subset of TOML 1.0 \
described below. Keep the public types and the signature exactly as they are:

  pub fn parse(src: &str) -> Result<Table, ParseError>

This is a long task with several separate parts. It is fine to build and \
test one part at a time.

## Document

The input is a sequence of lines. A newline is `\\n` or `\\r\\n`; a `\\r` not \
followed by `\\n` is an error. Whitespace means space or tab only. Each line \
is one of, optionally surrounded by whitespace and optionally followed by a \
comment:

- blank;
- a key/value pair, `key = value`;
- a table header, `[key]`;
- an array-of-tables header, `[[key]]`.

Anything else left on a line after its expression is a `Syntax` error. A \
comment starts with `#` and runs to the end of the line. Control characters \
(U+0000 to U+001F, and U+007F) are not allowed in comments or strings, except \
tab, and except the newlines a multi-line string may contain.

## Keys

A simple key is a bare key (one or more of `A-Z a-z 0-9 _ -`), a basic \
string or a literal string (as below, single-line only; `\"\"` is a valid \
empty key). A key is one or more simple keys joined by `.`, with optional \
whitespace around each dot: `a . \"b.c\" . 'd'` is the three keys `a`, \
`b.c`, `d`. Whitespace is allowed inside the brackets of headers, but the two \
brackets of `[[` and `]]` must be adjacent.

## Values

- **Basic string** `\"...\"`: escapes `\\b \\t \\n \\f \\r \\\" \\\\`, `\\uXXXX` \
and `\\UXXXXXXXX` (exactly 4 or 8 hex digits naming a Unicode scalar value). \
Any other backslash sequence is an `Escape` error at the backslash. A raw \
newline before the closing quote is a `Syntax` error.
- **Literal string** `'...'`: no escapes, no newlines.
- **Multi-line basic string** `\"\"\"...\"\"\"`: a newline straight after the \
opening delimiter is dropped. Newlines are kept, with `\\r\\n` read as `\\n`. \
Escapes as for basic strings, plus a backslash that is the last \
non-whitespace character on a line, which removes itself and all whitespace \
and newlines up to the next other character. Up to two `\"` may appear \
together in the content, including straight before the closing delimiter: \
`\"\"\"a\"\"\"\"` is `a\"`.
- **Multi-line literal string** `'''...'''`: the same, with no escapes.
- **Integer**: decimal with an optional `+` or `-`, or `0x`, `0o` or `0b` \
followed by hexadecimal (either case), octal or binary digits, with no sign. \
A decimal integer has no leading zero unless it is `0` itself (`+0` and \
`-0` are 0). In any base, `_` may appear only between two digits. A literal \
of the right form whose value does not fit in `i64` is an `Integer` error at \
the literal. Anything else, including floats, is a `Syntax` error.
- **Boolean**: `true` or `false`.
- **Array** `[ ... ]`: values separated by commas, a trailing comma allowed, \
and whitespace, newlines and comments allowed between elements. Elements may \
be of mixed types.
- **Inline table** `{ k = v, ... }`: on one line (a value inside may still \
span lines), pairs separated by commas, no trailing comma. Keys may be dotted.

## Tables

- A key/value pair goes into the table named by the most recent header, or \
the root table before any header.
- `[a.b.c]` defines the table `a.b.c`, creating `a` and `a.b` if they do not \
exist. The tables it creates on the way are only implicitly defined: a later \
`[a]` or `[a.b]` may define each of them, once.
- `[[a.b]]` appends a new table to the array of tables `a.b`, creating the \
array if it is missing. On a header's path, a step through an array of tables \
goes into its last element.
- A dotted key/value `a.b.c = 1` creates `a` and `a.b` as tables if they do \
not exist. A dotted key may pass through a table only if that table was \
created by dotted keys in the same section (the same header, or the root \
before any header, or the same inline table).
- An inline table, like any array or other value, is complete as written.

Everything below is a `Redefinition` error:

- setting a key that already exists;
- a dotted key passing through any table it may not, as above, or through a \
value that is not a table;
- defining a table with `[...]` that is already defined, whether by an \
earlier header, by dotted keys or as an inline table;
- a header whose path passes through a value that is not a table, or an \
array that is not an array of tables;
- `[[a]]` where `a` exists and is not an array of tables.

A `Redefinition` is reported at the start of the offending key, or at the \
`[` of the offending header.

## Result

Arrays of tables are `Value::Array` of `Value::Table`. Tables, implicit or \
not, are `Value::Table`.

## Errors

Report the first error in the input. `line` is 1-based: one more than the \
number of `\\n` before the position of the error. A `Syntax` error is at the \
first character where the input stops being a prefix of any valid document, \
or at the end of the input when it ends too soon. Where a position above \
says where an error is, that position wins.

The tests in `tests/basics.rs` are a start, not a specification; more will \
be run against your implementation afterwards. Do not change \
`tests/basics.rs` and do not add dependencies. `cargo check` must be clean.
"""
max_turns = 80

[expect]
cargo_check = "clean"
hidden_tests = true
files_unchanged = ["Cargo.toml", "tests/basics.rs"]

[[expect.not_contains]]
file = "src/lib.rs"
text = "todo!"

[[expect.not_contains]]
file = "src/lib.rs"
text = "unimplemented!"
