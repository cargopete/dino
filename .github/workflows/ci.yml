name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than floating on stable: an unpinned toolchain means CI
      # can fail on a lint that did not exist when the code was written, which
      # is a build that broke without anyone touching it.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The sandbox tests need the dino-confine helper beside the test binaries,
      # and `cargo test` does not guarantee a bin from another crate is built.
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Installing is how anyone but this repository gets a `dino`, and the sandbox
  # helper has to arrive with it. It did not, once: `dino-confine` lived in its
  # own crate and `cargo install` delivered only `dino`, leaving an installed
  # agent on Linux unable to run any process at all. This job is that regression.
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path crates/dino-cli --root "$RUNNER_TEMP/install" --locked
      - name: Both binaries installed
        run: |
          ls -1 "$RUNNER_TEMP/install/bin"
          test -x "$RUNNER_TEMP/install/bin/dino"
          test -x "$RUNNER_TEMP/install/bin/dino-confine"
      - name: The installed helper confines a write, run from elsewhere
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          cd /
          "$RUNNER_TEMP/install/bin/dino-confine" \
            --allow-write "$RUNNER_TEMP/ws" \
            -- /bin/sh -c 'echo escaped > /tmp/dino-ci-escape' && exit 1
          test ! -f /tmp/dino-ci-escape
          echo "the write was refused, as it should have been"
      - name: And allows one inside the workspace
        run: |
          "$RUNNER_TEMP/install/bin/dino-confine" \
            --allow-write "$RUNNER_TEMP/ws" \
            -- /bin/sh -c "echo fine > $RUNNER_TEMP/ws/written"
          test -f "$RUNNER_TEMP/ws/written"
      - name: A denied path cannot be read, and its neighbours can
        run: |
          mkdir -p "$RUNNER_TEMP/home/.ssh"
          echo secret > "$RUNNER_TEMP/home/.ssh/id_ed25519"
          echo fine > "$RUNNER_TEMP/home/.gitconfig"
          confine() {
            "$RUNNER_TEMP/install/bin/dino-confine" --allow-write "$RUNNER_TEMP/ws" \
              --deny-read "$RUNNER_TEMP/home/.ssh" -- "$@"
          }
          confine /bin/cat "$RUNNER_TEMP/home/.ssh/id_ed25519" && exit 1
          test "$(confine /bin/cat "$RUNNER_TEMP/home/.gitconfig")" = fine
          echo "the key was refused and its neighbour was read"
      - name: The toolchain still runs with the real ~/.ssh denied
        run: |
          mkdir -p "$HOME/.ssh"
          "$RUNNER_TEMP/install/bin/dino-confine" --allow-write "$RUNNER_TEMP/ws" \
            --deny-read "$HOME/.ssh" -- cargo --version
          "$RUNNER_TEMP/install/bin/dino-confine" --allow-write "$RUNNER_TEMP/ws" \
            --deny-read "$HOME/.ssh" -- git --version

  # RFC-0009 section 5.2 step 1. This reports facts and asserts nothing, because
  # the point is to find out whether the kernel floor chosen in section 5.1 is
  # reachable on a hosted runner before any sandbox code is written for it.
  landlock-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kernel version
        run: uname -r
      - name: Active LSMs
        run: cat /sys/kernel/security/lsm || echo "securityfs not mounted"
      - name: Landlock ABI, as the kernel reports it
        run: |
          cat > /tmp/probe.c <<'C'
          #include <linux/landlock.h>
          #include <stdio.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          int main(void) {
              long abi = syscall(__NR_landlock_create_ruleset, NULL, 0,
                                 LANDLOCK_CREATE_RULESET_VERSION);
              if (abi < 0) {
                  printf("landlock unavailable (errno-bearing return %ld)\n", abi);
                  return 0;
              }
              printf("landlock ABI %ld; RFC-0009 needs 4 or higher\n", abi);
              return 0;
          }
          C
          cc /tmp/probe.c -o /tmp/probe && /tmp/probe
